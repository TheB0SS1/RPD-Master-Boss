                    let statusHtml = '';
                    if (progress.completed) {
                        statusHtml = `<span class="status-badge completed">Completed</span>`;
                    } else if (progress.lastIndex > 0) {
                        statusHtml = `<span class="status-badge">In Progress</span>`;
                    }

                    card.innerHTML = `
                        ${statusHtml}
                        <h3>Chapter ${i}</h3>
                        <p>Questions ${start + 1} - ${end}</p>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: ${progress.percent}%"></div>
                        </div>
                    `;
                    this.elements.chapterList.appendChild(card);
                }
            },

            getChapterProgress(chapterNum) {
                const saved = localStorage.getItem(`rpdboss_chapter${chapterNum}`);
                if (saved) {
                    const data = JSON.parse(saved);
                    const percent = (data.lastIndex / 30) * 100;
                    return { lastIndex: data.lastIndex, completed: data.completed, percent: percent };
                }
                return { lastIndex: 0, completed: false, percent: 0 };
            },

            startChapter(chapterNum) {
                this.currentChapter = chapterNum;
                const progress = this.getChapterProgress(chapterNum);
                
                if (progress.completed) {
                    // Ask to restart or just view results? Let's restart for practice.
                    if(!confirm("Chapter completed. Retake?")) return;
                    this.resetChapterState();
                } else {
                    this.currentQuestionIndex = progress.lastIndex;
                    // Load previous answers if needed (simplified here: just resuming index)
                    // In a fuller app, we'd load the score so far. 
                    // For this design, we resume question index but reset current session score.
                    this.score = 0; 
                    this.userAnswers = new Array(30).fill(null);
                }

                this.switchView('quiz');
                this.elements.homeBtn.style.display = 'block';
                this.renderQuestion();
            },

            resetChapterState() {
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.userAnswers = new Array(30).fill(null);
                localStorage.removeItem(`rpdboss_chapter${this.currentChapter}`);
            },

            renderQuestion() {
                const qIndex = (this.currentChapter - 1) * 30 + this.currentQuestionIndex;
                const qData = questionsData[qIndex];

                // Update Progress
                this.elements.progressTracker.textContent = `Question ${this.currentQuestionIndex + 1}/30`;

                // Render Text
                this.elements.questionText.textContent = qData.q;

                // Render Options
                this.elements.optionsList.innerHTML = '';
                qData.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => this.handleAnswer(idx, btn);
                    this.elements.optionsList.appendChild(btn);
                });

                // Reset Feedback
                this.elements.feedbackArea.className = 'feedback-area';
                this.elements.nextBtn.style.display = 'none';
            },

            handleAnswer(selectedIndex, btnElement) {
                // Disable all buttons
                const buttons = this.elements.optionsList.querySelectorAll('.option-btn');
                buttons.forEach(b => b.disabled = true);

                const qIndexGlobal = (this.currentChapter - 1) * 30 + this.currentQuestionIndex;
                const correctIndex = questionsData[qIndexGlobal].a;
                const isCorrect = selectedIndex === correctIndex;

                if (isCorrect) {
                    btnElement.classList.add('correct');
                    this.score++;
                    this.showFeedback(true, "Correct! " + (this.currentQuestionIndex === 29 ? "Perfect finish!" : "Great job!"), questionsData[qIndexGlobal].exp);
                } else {
                    btnElement.classList.add('wrong');
                    // Highlight correct one
                    buttons[correctIndex].classList.add('correct');
                    this.showFeedback(false, "Incorrect", questionsData[qIndexGlobal].exp);
                }

                this.userAnswers[this.currentQuestionIndex] = selectedIndex;
                this.saveProgress();
                this.elements.nextBtn.style.display = 'inline-block';
            },

            showFeedback(isCorrect, title, explanation) {
                const area = this.elements.feedbackArea;
                const titleEl = this.elements.feedbackTitle;
                const textEl = this.elements.explanationText;

                area.className = `feedback-area show ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
                
                // Icon
                const icon = isCorrect ? '✅' : '🛑'; // Hand/Stop icon for wrong as requested
                titleEl.innerHTML = `<span>${icon}</span> ${title}`;
                textEl.textContent = explanation;
            },

            nextQuestion() {
                this.currentQuestionIndex++;
                if (this.currentQuestionIndex >= 30) {
                    this.finishChapter();
                } else {
                    this.renderQuestion();
                }
            },

            saveProgress() {
                const data = {
                    lastIndex: this.currentQuestionIndex + (this.elements.nextBtn.style.display === 'inline-block' ? 1 : 0),
                    completed: false,
                    score: this.score // Saving current score in case of crash (optional)
                };
                localStorage.setItem(`rpdboss_chapter${this.currentChapter}`, JSON.stringify(data));
            },

            finishChapter() {
                // Mark as complete
                const data = { lastIndex: 30, completed: true, score: this.score };
                localStorage.setItem(`rpdboss_chapter${this.currentChapter}`, JSON.stringify(data));
                
                this.showResults();
            },

            showResults() {
                this.switchView('result');
                this.elements.homeBtn.style.display = 'none';

                const percent = Math.round((this.score / 30) * 100);
                this.elements.finalScore.textContent = `${percent}%`;
                
                // Animate circle
                this.elements.scoreCircle.style.background = `conic-gradient(var(--primary-orange) ${percent}%, #eee ${percent}%)`;

                this.elements.resultDetails.textContent = `You answered ${this.score} out of 30 questions correctly.`;

                if (percent >= 80) {
                    this.elements.resultMsg.textContent = "Excellent Work, Boss!";
                    this.elements.resultMsg.style.color = "var(--success-green)";
                } else if (percent >= 50) {
                    this.elements.resultMsg.textContent = "Good Job!";
                    this.elements.resultMsg.style.color = "var(--primary-orange)";
                } else {
                    this.elements.resultMsg.textContent = "Keep Practicing!";
                    this.elements.resultMsg.style.color = "var(--error-red)";
                }
            },

            retryChapter() {
                this.resetChapterState();
                this.startChapter(this.currentChapter);
            },

            goHome() {
                this.switchView('home');
                this.elements.homeBtn.style.display = 'none';
                this.renderChapterList();
            },

            switchView(viewName) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                if (viewName === 'home') this.elements.homeView.classList.add('active');
                if (viewName === 'quiz') this.elements.quizView.classList.add('active');
                if (viewName === 'result') this.elements.resultView.classList.add('active');
                window.scrollTo(0,0);
            }
        };

        // Initialize App
        app.init();

    </script>
</body>
</html>
